# Local + production-ready Chroma stack.
# - Pinned image version (no :latest in production).
# - Docker-managed named volume (chroma-data) for persistence.
#   On Windows, this is 10-20× faster than a bind mount because the data lives
#   on Docker's internal Linux filesystem instead of being translated through
#   Windows ↔ WSL2/Hyper-V on every small write. On Linux/macOS the speed is
#   the same as a bind mount, and named volumes match production Kubernetes /
#   Docker patterns — so the configuration is portable. See ADR 0006.
# - Health check so docker-compose / orchestrators know when Chroma is ready.
# - Anonymous telemetry off.

services:
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: hybrid-rag-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma     # named volume, not bind mount
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------
  # Redis — Phase 1.7.5 Sprint A. Backs the distributed ingestion lock,
  # the post-ingestion integrity marker, and (future Sprint B) caches.
  # Persistent volume + appendonly so a docker-compose restart does not
  # lose the integrity marker. Same Windows-perf rationale as Chroma.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hybrid-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Elasticsearch — Phase 4 (Hybrid Retrieval). BM25 keyword search engine,
  # fused with Chroma vector results via RRF. Single-node dev cluster with
  # security disabled (DEV ONLY — never ship security disabled to production;
  # enable xpack.security + TLS + credentials there). 512 MB JVM heap is plenty
  # for ~53k podcast chunks. Named volume for persistence, same Windows-perf
  # rationale as Chroma/Redis. See docs/phases/phase-4.md.
  # ---------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: hybrid-rag-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------
  # Neo4j entity graph — Phase 3+ (kept here so the topology is visible).
  # Enable by removing the comment markers below and `docker compose up -d neo4j`.
  # ---------------------------------------------------------------
  # neo4j:
  #   image: neo4j:5.20-community
  #   container_name: hybrid-rag-neo4j
  #   ports:
  #     - "7474:7474"   # HTTP browser
  #     - "7687:7687"   # Bolt protocol
  #   volumes:
  #     - neo4j-data:/data
  #   restart: unless-stopped
  #   environment:
  #     NEO4J_AUTH: neo4j/replace-me
  #     NEO4J_PLUGINS: '["apoc"]'
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s

volumes:
  chroma-data:
  redis-data:
  elasticsearch-data:
  # neo4j-data:  # uncomment with the neo4j service above
